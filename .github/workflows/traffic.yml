name: Pachuca Mobility Traffic Collector

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-traffic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run traffic collector
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: python collector.py

      - name: Build Gold layer
        run: python build_gold.py

      - name: Persist traffic and Gold data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/silver/traffic/
          git add data/gold/traffic/

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos en Silver o Gold."
          else
            git commit -m "Update traffic and gold data"
            git push
          fi
